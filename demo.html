<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>TVConecta - Demo</title>
    <meta name="Descripción" content="Demostración de TVConecta" />
    <link rel="icon" href="img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/demo.css">
    <link href="https://vjs.zencdn.net/7.2.3/video-js.css" rel="stylesheet">
</head>

<body>
    <div class="power-switch">
        <input type="checkbox" onchange="playSound(this)" />
        <div class="button">
            <svg class="power-off">
                <use xlink:href="#line" class="line" />
                <use xlink:href="#circle" class="circle" />
            </svg>
            <svg class="power-on">
                <use xlink:href="#line" class="line" />
                <use xlink:href="#circle" class="circle" />
            </svg>
        </div>
    </div>

    <audio id="startup">
        <source src="sounds/startup.mp3" type="audio/mpeg">
    </audio>

    <!-- SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" id="line">
            <line x1="75" y1="34" x2="75" y2="58" />
        </symbol>
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" id="circle">
            <circle cx="75" cy="80" r="35" />
        </symbol>
    </svg>

    <button class="modo-complejo"
        style="position: absolute; right: 20px; top: 20px; width: 46vw; height: 95vh; font-size: 35px;">Modo
        Complejo</button>
    <button id="modo-sencillo" class="modo-sencillo"
        style="position: absolute; left: 20px; top: 20px; width: 46vw; height: 95vh; font-size: 35px;">Modo
        Sencillo</button>

    <div id="tv-wrapper">
        <div id="symbol">
            <div id="tv-screen">
                <div id="tv-content">
                    <video id='hls-example'  class="video-js vjs-default-skin" width="400" height="300" controls>
                        <source type="application/x-mpegURL" src="video/la1_main_dvr.m3u8">
                        </video>
                </div>
            </div>
        </div>
        <div id="tv-remote">
            <button class="power" onclick="playSoundAndRedirect()"><img src="img/power.svg" /></button>
            <div class="channel-list">
                <button class="channel" onclick="openTV()">
                    <img src="img/Logo_TVE-1.png" alt="Logo de TVE-1">
                </button>

                <!-- Otros botones de canales  -->
                <button class="channel"><img src="img/Logo_TVE-2.png" /></button>
                <button class="channel"><img src="img/Logo_ANTENA3.png" /></button>
                <button class="channel"><img src="img/Logo_CUATRO.png" /></button>
                <button class="channel"><img src="img/Logo_TELECINCO.png" /></button>
                <button class="channel"><img src="img/Logo_SEXTA.png" /></button>
            </div>
            <div class="controls">
                <button class="volume-down"><img src="img/volume-1.svg" /></button>
                <button class="volume-up"><img src="img/volume-2.svg" /></button>
                <button class="channel-down"><img src="img/channel-.svg" /></button>
                <button class="channel-up"><img src="img/channel+.svg" /></button>
                <button class="mute"><img src="img/volume-x.svg" /></button>
            </div>
        </div>
    </div>


    <script src="js/demo.js"></script>
    <script src="https://vjs.zencdn.net/ie8/ie8-version/videojs-ie8.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-hls/5.14.1/videojs-contrib-hls.js"></script>
    <script src="https://vjs.zencdn.net/7.2.3/video.js"></script>
    
    <script>
    var player = videojs('hls-example');
    player.play();
    </script>

</body>

</html>
